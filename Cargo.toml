[package]
name = "rust_secure_dependency_audit"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
authors = ["Godfrey Lebo <emorylebo@gmail.com>"]
description = "Audit Cargo dependencies for supply-chain health: maintenance scores from crates.io, GitHub and OpenSSF Scorecard, SPDX license risk, and a CI gate CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emorilebo/rust_secure_dependency_audit"
homepage = "https://github.com/emorilebo/rust_secure_dependency_audit"
documentation = "https://docs.rs/rust_secure_dependency_audit"
readme = "README.md"
keywords = ["audit", "supply-chain", "dependencies", "license", "security"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
    "error.log",
    "PUBLISH.md",
    ".github/",
    "tests/fixtures/",
]

[[bin]]
name = "secure-audit"
path = "src/bin/secure-audit.rs"

[dependencies]
# Core dependencies
cargo_metadata = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"

# HTTP client and async runtime
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.35", features = ["full"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# License parsing
spdx = "0.10"

# URL encoding for GitLab API
urlencoding = "2.1"

# CLI
clap = { version = "4.4", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
mockito = "1.2"
tempfile = "3.8"
anyhow = "1.0"
tokio = { version = "1.35", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
